<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KA!ZERR STORE | Авторизация</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header" id="main-header"></header>

    <main class="container main-content auth-page">
        <div class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab-btn active" id="tab-login">Вход</button>
                <button class="auth-tab-btn" id="tab-register">Регистрация</button>
            </div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="Введите email">
                </div>
                <div class="form-group">
                    <label for="login-password">Пароль</label>
                    <input type="password" id="login-password" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Войти в систему</button>
            </form>

            <form id="register-form" class="auth-form hidden">
                <div class="form-group">
                    <label for="reg-name">Имя пользователя</label>
                    <input type="text" id="reg-name" required placeholder="Как вас зовут?">
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="Ваш действующий email">
                </div>
                <div class="form-group">
                    <label for="reg-password">Пароль</label>
                    <input type="password" id="reg-password" required placeholder="Минимум 6 символов">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
            </form>
        </div>
    </main>

    <script src="js/models.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
