<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KA!ZERR STORE | Главная</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header" id="main-header"></header>

    <main class="container main-content">
        <section class="filter-section">
            <h2 class="section-title">Категории</h2>
            <div class="category-tags" id="categories-container">
                <button class="tag-btn active" data-category="all">Все товары</button>
            </div>
        </section>

        <section class="catalog-section">
            <h1 class="page-title">Игровой Каталог</h1>
            <div class="catalog" id="catalog-container">
                <div class="loader">Загрузка снаряжения...</div>
            </div>
        </section>
    </main>

    <script src="js/models.js"></script>
    <script src="js/api.js?v=3"></script>
    <script src="js/common.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
